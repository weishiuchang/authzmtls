# CI: build/vet/test/lint the Go module plus a build-only smoke test of
# deploy/Dockerfile's two targets. Kept independent of docker-publish.yaml
# (no shared triggers/secrets) so it's safe to run on pull_request from forks.
#
# Go version comes from go.mod via `go-version-file` so it can't drift. This
# workflow is the one place allowed to run `go`/`golangci-lint` directly on
# the runner instead of via `docker run`, per this repo's build/test rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build / vet / test -race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./... -race
        run: go test ./... -race

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker-build:
    name: docker build (${{ matrix.target }}) smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [release, debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive short SHA for build version
        id: version
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Build-only (no push) - catches Dockerfile/build-context breaks
      # independently of docker-publish.yaml, which owns actual publishing.
      - name: docker build --target ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: authzmtls:${{ matrix.target }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
