{{/*
Only rendered for the inline-PEM TLS mode (values.yaml's tls.cert/tls.key) -
existingSecret mode references a Secret this chart never creates.
*/}}
{{- if and (not .Values.tls.existingSecret) .Values.tls.cert .Values.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authzmtls.fullname" . }}-tls
  labels:
    {{- include "authzmtls.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.tls.cert | quote }}
  tls.key: {{ .Values.tls.key | quote }}
{{- end }}
