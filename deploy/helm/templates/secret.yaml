{{/*
Renders config.yaml (internal/config/config.go's schema) straight from
.Values.config: toYaml'd back into YAML text, then tpl'd against this
release's context (so a value like `{{ .Release.Namespace }}` embedded
inside .Values.config gets evaluated), and stored in a Secret rather than a
ConfigMap - datasources[].bind_pw is a plaintext credential, and a
ConfigMap is world-readable in a way a Secret at least conventionally isn't.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authzmtls.fullname" . }}
  labels:
    {{- include "authzmtls.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- tpl (toYaml .Values.config) . | nindent 4 }}
